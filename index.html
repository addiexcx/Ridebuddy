<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RideBuddy Driver Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Figma Flow 3 (6th Version) rebuilt 1:1 at the design's 1680px frame size; the frame scales down to fit narrower windows. */
:root{
  --ink:#0f0f0f; --black:#000000; --g5e:#5e5e5e; --g8a:#8a8a8a; --g8f:#8f8f8f; --line:#ececec; --line2:#e0e0e0;
  --navy:#034373; --navy-bg:#f5fbff; --red:#df0021; --blue:#076bb6; --sky:#97b9df; --tile:#f2f1f1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
  fit();
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.stage{padding:0;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:1680px;min-width:1200px;display:flex;background:#fff;overflow:hidden;flex:none}
.app-inner{display:flex;width:100%}
.main{min-width:0}
/* Left menu */
.left{width:240px;flex:none;display:flex;flex-direction:column;gap:4px;padding:16px;border-right:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:10px;padding:4px;height:40px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.brand b{font-size:15px;font-weight:600;width:135px}
.left .sp12{height:12px;flex:none}
.sec{padding:8px;font-size:10px;font-weight:500;color:var(--g8a);letter-spacing:.08em;text-transform:uppercase;height:28px;line-height:12px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;height:36px;font-size:13px;font-weight:500;color:var(--g5e);width:207px}
.mi svg{flex:none}
.mi.sub{padding:7px 10px 7px 40px;height:30px}
.mi.on{background:#f2f2f2;color:var(--ink);font-weight:600}
.mi .grow{flex:1}
.badge{background:#e8456b;color:#fff;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:600;line-height:13px}
.left .spacer{flex:1}
.left .rule{height:1px;background:var(--line);flex:none}
/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;width:300px;height:32px}
.search span{font-size:13px;color:var(--g8a);flex:1}
.search kbd{font:11px var(--font);color:var(--g8a)}
.av{width:32px;height:32px;border-radius:999px;background:#d9d9d9;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--g5e)}
.subbar{height:32px;background:#f5f5f5;display:flex;align-items:center;gap:24px;padding:8px 12px;font-size:11px;color:var(--g5e)}
body{caret-color:transparent}
input,textarea,[contenteditable]{caret-color:auto}
.subbar .chg{display:flex;align-items:center;gap:6px;white-space:pre}
/* Register page */
.ph{padding:24px 40px 20px;display:flex;flex-direction:column;gap:16px}
.ph h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.005em;line-height:34px}
.ph p{margin:0;font-size:13px;color:var(--g5e);line-height:16px}
.tabsrow{display:flex;align-items:center;justify-content:space-between;padding:0 41px;height:34px}
.tabs{display:flex;gap:8px}
.tab{padding:8px 14px;border-radius:999px;background:var(--navy-bg);color:var(--navy);font-size:13px;font-weight:600;line-height:16px}
.tab.on{background:var(--navy);color:#fff}
.tright{display:flex;gap:10px;align-items:center}
.rsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;width:300px;height:34px}
.rsearch input{border:0;outline:0;font:13px var(--font);color:var(--ink);flex:1;min-width:0;padding:0;background:transparent}
.rsearch input::placeholder{color:var(--g8f)}
.fbtn{width:34px;height:34px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center}
.wrap{padding:0 40px}
.card{background:#fff;border-radius:12px;padding:4px 10px;display:flex;flex-direction:column}
.tb{height:48px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.tb .l{display:flex;align-items:center;gap:14px}
.tb .cnt{font-size:13px;font-weight:600}
.tb .hint{font-size:12px;color:var(--g8a)}
.tb .hint button{color:var(--g8a)}
.tb .hint button:hover{color:var(--ink);text-decoration:underline}
.tb .clr{font-size:12px;font-weight:500;color:#0e7a33}
.tb .saved{font-size:12px;font-weight:600;color:#0e6b33}
.tb .r{display:flex;gap:8px;align-items:center}
.ta-wrap{background:var(--ink);border-radius:8px;padding:3px;display:flex}
.ta-wrap button{padding:4px 10px;border-radius:6px;color:#fff;font-size:11.5px;font-weight:600;line-height:14px}
.flagbtn{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:500;line-height:14px}
.thead,.row{display:flex;align-items:center;padding:0 10px}
.thead{height:30px;border-bottom:1px solid var(--line2)}
.thead .c{font-size:10px;font-weight:500;color:var(--g8a);letter-spacing:.08em;text-transform:uppercase;line-height:12px}
.thead .c button{letter-spacing:inherit;text-transform:inherit;color:inherit;font-size:inherit;font-weight:inherit}
.thead .c button:hover,.thead .c button.act{color:var(--ink)}
.c{flex:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.rows{height:660px;overflow-y:auto}
.tablex{overflow-x:auto}
.tablex > *{min-width:1340px}
.row{height:36px;border-bottom:1px solid var(--line);position:relative}
.row:hover{background:#fafafa}
.row.selr,.row.selr:hover{background:#ECF5FF}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #bdbdbd;background:#fff;display:grid;place-items:center}
.cb.on{background:var(--ink);border-color:var(--ink)}
.sno{font-size:12px;color:var(--g8a)}
.nm{font-size:12.5px;font-weight:600}
.idtag{background:#f2f2f2;color:var(--g5e);border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:500;line-height:13px}
.veh{font-size:12.5px;font-weight:500}
.plate{font-size:11.5px;color:var(--g5e)}
.trip{font-size:12px}
.n125{font-size:12.5px;font-weight:500}
.sc{font-size:12.5px;font-weight:600}
.pill{border-radius:10px;padding:3px 8px;font-size:11px;font-weight:600;line-height:13px}
.sev{border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:500;line-height:14px}
.none{font-size:12px;color:var(--g8a)}
.st{display:flex;align-items:center;gap:6px;padding:3px 9px;font-size:11px;font-weight:600;color:#000;line-height:13px}
.st i{width:6px;height:6px;border-radius:50%}
.noact{font-size:12px;color:#000}
.flag{position:absolute;top:8px;width:20px;height:20px;display:none}
.flag.on,.row:hover .flag{display:block}
.flag svg{display:block}
.flag .red{display:none}
.flag.on .red,.flag:hover .red{display:block}
.flag.on .blk,.flag:hover .blk{display:none}
.empty{padding:10px;font-size:13px;color:var(--g5e);line-height:17px}
.foot{height:58px;padding:14px 10px;display:flex;justify-content:space-between;align-items:center}
.foot .t{font-size:12.5px;color:var(--g5e)}
.pager{display:flex;gap:6px;align-items:center}
.pg{width:30px;height:30px;border:1px solid var(--line2);border-radius:8px;background:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.pg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pg.dots{border-color:transparent}
.rowsl{font-size:12px;color:var(--g5e);margin-right:4px}
.pgw{width:auto;padding:0 10px}
.csr{justify-content:flex-start;gap:6px}
.csr .a{font-size:12px;color:var(--ink)}
.csr .b{font-size:10px;color:var(--g5e)}
.bottom{height:24px}
/* Overview */
.oh{padding:32px 40px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.oh h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.005em;line-height:34px;color:#000}
.oh p{margin:4px 0 0;font-size:13px;color:var(--g5e);line-height:16px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;color:#000;line-height:16px;height:34px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;height:32px}
.osec{padding:32px 40px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:28px}
.shd{display:flex;justify-content:space-between;align-items:center}
.shd h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.003em;line-height:27px;color:#000}
.shd p{margin:4px 0 0;font-size:12px;color:var(--g5e);line-height:15px}
.kpis{display:flex}
.kpi{display:flex;flex-direction:column;gap:10px;padding-left:24px;border-left:1px solid var(--line);flex:1 1 0;min-width:0}
.kpi:first-child{padding-left:0;border-left:0}
.kpi .in{display:flex;flex-direction:column;gap:6px}
.kl{font-size:10px;font-weight:500;color:var(--g5e);letter-spacing:.08em;text-transform:uppercase;line-height:12px}
.kv{font-size:28px;font-weight:600;letter-spacing:-.005em;line-height:34px;color:#000}
.ks{font-size:12px;color:var(--g5e);line-height:15px}
.bar{width:80px;height:4px;border-radius:2px}
.tiles{display:flex;gap:12px;padding-top:4px}
.tile{flex:1 1 0;min-width:0;background:var(--tile);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .v{font-size:22px;font-weight:600;line-height:27px;color:#000}
.two{display:flex;border-bottom:1px solid var(--line)}
.col{flex:1 1 0;min-width:0;padding:32px 40px;display:flex;flex-direction:column;gap:18px}
.col + .col{border-left:1px solid var(--line)}
.col > svg{width:100%;height:auto}
.legend{display:flex;gap:16px;align-items:center}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:#000}
.lg i{width:16px;height:16px;border-radius:4px;display:grid;place-items:center}
.ins{background:var(--tile);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--g5e);line-height:15px}
.tcol{gap:12px;border-bottom:0}
.trh{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trh div{font-size:10px;font-weight:500;color:var(--g5e);letter-spacing:.08em;text-transform:uppercase;line-height:13px}
.tr{display:flex;gap:12px;padding:12px 0;align-items:center;border-bottom:1px solid var(--line);height:56px}
.w374{flex:1;min-width:0}.w50{width:50px;text-align:right}.w60{width:60px;text-align:right}.w120{width:120px}
.tr b{display:block;font-size:13px;font-weight:600;color:#000;line-height:16px}
.tr small{display:block;font-size:11px;color:var(--g5e);line-height:13px;margin-top:2px}
.tr .s{font-size:14px;font-weight:600}
.tr .d{font-size:13px;font-weight:500}
.op{display:inline-block;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:500;line-height:15px;white-space:nowrap}
/* Overlays */
.ovl{position:absolute;inset:0;z-index:10;display:none}
.ovl.show{display:block}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.ovl.mod{position:fixed}
.ovl.mod.show{display:flex;align-items:center;justify-content:center}
.dlg{position:relative;width:720px;background:#fff;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.3);padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-size:19px;font-weight:600;line-height:23px}
.dh p{margin:4px 0 0;font-size:12.5px;color:var(--g5e);line-height:15px}
.xb{width:30px;height:30px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center}
.lab{font-size:10px;font-weight:500;color:var(--g8a);letter-spacing:.08em;line-height:12px}
.grp{display:flex;flex-direction:column;gap:10px}
.acts{display:flex;gap:10px}
.act{width:158.3px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(224,224,224,.9)}
.act .rd{width:16px;height:16px;border-radius:8px;border:1.5px solid #bdbdbd;display:grid;place-items:center;flex:none}
.act.on .rd{border-color:var(--ink)}
.act.on .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.act b{display:block;font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}
.act small{display:block;font-size:11.5px;color:var(--g8a);line-height:14px;margin-top:2px;white-space:nowrap}
.act.dis{opacity:.4;cursor:default;pointer-events:none}
.days{display:flex;align-items:center;gap:12px}
.step{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;height:38px;width:134px;overflow:hidden}
.step button{width:34px;height:36px;display:grid;place-items:center;font-size:16px;font-weight:500}
.step .v{width:64px;height:36px;display:grid;place-items:center;font-size:14px;font-weight:600;border-left:1px solid var(--line2);border-right:1px solid var(--line2);background:#fff}
.dl{font-size:13px;color:var(--g5e)}
.pres{display:flex;gap:8px}
.pre{border:1px solid #d0d0d0;border-radius:14px;padding:6px 12px;font-size:12.5px;font-weight:500;line-height:15px;background:#fff}
.pre.on{border-color:var(--ink);font-weight:600}
.grp.off{opacity:.4;pointer-events:none}
textarea{width:664px;height:87px;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:13px/16px var(--font);color:var(--ink);resize:none;outline:0}
.df{display:flex;justify-content:space-between;align-items:center}
.b2{display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;line-height:16px;height:36px}
.b2.k{background:var(--ink);border-color:var(--ink);color:#fff;height:34px}
.pop{position:absolute;width:250px;background:#fff;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(224,224,224,.9);padding:14px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pop h4{margin:0;font-size:14px;font-weight:500;color:#1f1f1f;line-height:17px}
.pop .cur{font-size:12px;color:#1f1f1f;line-height:15px}
.opt{height:32px;border-radius:8px;padding:6px 10px;display:flex;align-items:center;font-size:11.5px;font-weight:500;line-height:14px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(224,224,224,.9);width:226px}
.opt:hover{background:#f7f7f7}
.opt.on{background:#f2f2f2}
.opt.reset{height:26.4px}

/* Expanded row (Driver Register - row expanded - short, trigger charts) */
.row{cursor:default}
.row .nm{cursor:pointer}
.row .nm:hover{text-decoration:underline;text-underline-offset:2px}
.row.open{background:#fafafa}
.xr{background:#fafafb;border-bottom:1px solid #e6e6e6;border-radius:21px;padding:16px 24px;display:flex;flex-direction:column;gap:14px;cursor:default}
.xh{display:flex;align-items:center;gap:14px;height:48px}
.xav{width:48px;height:48px;border-radius:24px;background:#e8e4f8;color:#4a3a9a;display:grid;place-items:center;font-size:15px;font-weight:600;flex:none}
.xt{display:flex;flex-direction:column;gap:3px}
.xt .l1{display:flex;align-items:center;gap:8px}
.xt .l1 b{font-size:17px;font-weight:600;line-height:21px}
.xtag{border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:500;line-height:14px;white-space:nowrap}
.xt .l2{font-size:12.5px;color:#5e5e5e;line-height:15px}
.xh .spc{flex:1}
.xacts{display:flex;gap:8px;align-items:center}
.xb1{background:#0f0f0f;color:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;line-height:15px;height:32px}
.xb2{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;line-height:15px;height:32px}
.xcol{width:32px;height:32px;border:1px solid #e0e0e0;border-radius:8px;display:grid;place-items:center}
.xcols{display:flex;gap:12px;background:#fff}
.xp{flex:1 1 0;min-width:0;background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.xcap{font-size:10px;font-weight:500;color:#8a8a8a;letter-spacing:.08em;line-height:12px;text-transform:uppercase}
.xbody{display:flex;flex-direction:column;gap:12px}
.xkv{display:flex;gap:8px;font-size:12px;line-height:15px}
.xkv span:first-child{width:96px;flex:none;color:#8a8a8a}
.xkv span:last-child{font-size:12.5px;font-weight:500;color:#0f0f0f}
.xhd{display:flex;justify-content:space-between;align-items:center;height:20px}
.xhd .ti{display:flex;gap:8px;align-items:center}
.xhd .ti b{font-size:11.5px;font-weight:500;line-height:14px}
.xtags{display:flex;gap:8px}
.xbars{display:flex;flex-direction:column;gap:8px}
.xbar{display:flex;align-items:center;gap:10px;height:15px}
.xbar .nm2{width:84px;flex:none;font-size:12px;color:#8a8a8a}
.xbar .tr2{flex:1;height:8px;border-radius:4px;background:#f0f0f0;overflow:hidden}
.xbar .tr2 i{display:block;height:8px;border-radius:4px}
.xbar .ct{width:12px;flex:none;font-size:12px;font-weight:600}
.xtl{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.xax{display:flex;justify-content:space-between;font-size:10px;color:#8a8a8a;line-height:12px}
.xax .m{color:#c0264a;font-weight:500}
.xmet{display:flex;justify-content:space-between;align-items:center;gap:12px}
.xmet .tx{display:flex;flex-direction:column;gap:2px}
.xmet .tx span{font-size:12px;color:#8a8a8a;line-height:15px}
.xmet .tx b{font-size:12.5px;font-weight:500;line-height:15px}
.xcn{background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:11px 16px;display:flex;gap:16px;align-items:center}
.xcn b{font-size:12.5px;font-weight:500;white-space:nowrap}
.xcn .sm{flex:1;min-width:0;font-size:12.5px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Scrim (table only) + focus outline, as in the trigger charts screen */
.card{position:relative}
.tscrim{position:absolute;inset:0;border-radius:12px;background:rgba(10,13,15,.55);z-index:2;cursor:default}
.xr{position:sticky;left:0;z-index:3;box-sizing:border-box;width:var(--tw,100%);max-width:var(--tw,100%);overflow:hidden}
.xr{box-shadow:0 12px 40px rgba(0,0,0,.35)}

/* Driver profile (Overview V2) + Counselling log */
.pc{padding:24px 40px;display:flex;flex-direction:column;gap:20px}
.pc.cl{gap:14px}
.crumb{display:flex;gap:8px;font-size:12px;color:#8a8a8a;line-height:15px}
.crumb button{color:#8a8a8a;font-size:12px}
.crumb button:hover{color:#0f0f0f;text-decoration:underline}
.crumb b{color:#0f0f0f;font-weight:500}
.hcard{background:#fff;border-radius:16px;padding:20px;display:flex;align-items:center;gap:18px}
.hav{width:72px;height:72px;border-radius:36px;background:#f2f2f2;display:grid;place-items:center;font-size:22px;font-weight:600;flex:none}
.hinfo{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hinfo .l1{display:flex;align-items:center;gap:10px}
.hinfo .l1 b{font-size:22px;font-weight:600;line-height:27px}
.hinfo .l2{font-size:13px;color:#5e5e5e;line-height:16px}
.hinfo .l3{font-size:12.5px;color:#8a8a8a;line-height:15px;white-space:pre}

const XTAG = {SOS:["#c0264a","#ffffff"], DMS:["#fff4cc","#8a6a00"], Overspeeding:["#fdebd6","#9a5a00"], "Rash driving":["#fce8ee","#c0264a"], "Driver fatigue":["#e8e4f8","#4a3a9a"]};

const ROUTES = ["Whitefield → Manyata","Koramangala → Hebbal","Electronic City → MG Road","Indiranagar → Airport","HSR Layout → Bellandur","Marathahalli → Yeshwanthpur"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hsh = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 9973; return h; };
function xdata(r){
  const h = hsh(r.name);
  const counts = {}; if (r.name === "Devraj Kumar") { counts["Rash driving"] = 3; counts.DMS = 2; counts.SOS = 1; } else r.pills.forEach(p => { if (p === "+1") return; const k = Object.keys(XCOL).find(k => p.startsWith(k)); const m = p.match(/x(\d+)/); counts[k] = (counts[k]||0) + (m ? +m[1] : 1); });

  const per = r.trips / 7; const days = [0,1,2,3,4,5,6].map(i => Math.max(1, Math.round(per + ((h >> i) % 3) - 1))); days[2] += r.trips - days.reduce((a,b)=>a+b,0); days[2] = Math.max(1, days[2]);

}
function timelineSvg(counts){

  for (let w = 1; w <= 12; w++) g += `<path d="M${x(w)} 11.01V16.89" stroke-width="0.98" stroke="#D9D9D9"/>`;
  const ev = []; const order = ["Rash driving","Overspeeding","Driver fatigue","DMS","SOS"];
  order.forEach(k => { const n = counts[k] || 0; for (let i = 0; i < n; i++) ev.push([k, k === "SOS" ? 12 : k === "DMS" ? 12 - (n - 1 - i) : (k === "Rash driving" ? 2 + i : k === "Overspeeding" ? 3 + i * 2 : 5 + i * 2)]); });
  const st = {};
  ev.forEach(([k, w]) => { w = Math.max(1, Math.min(12, w)); const s = st[w] = (st[w]||0); st[w]++; g += `<circle cx="${x(w)}" cy="${(13.95 - s * 8.81).toFixed(2)}" r="4.4" fill="${XCOL[k]}" stroke="white" stroke-width="1.47"/>`; });

function sparkSvg(a, b){

app.addEventListener("input", e => { if (e.target.id === "cm") { S.comment = e.target.value; S.commentEdited = true; } });
function allowed(){ return S.route === "high-performing" ? ["appreciate"] : S.route === "all" ? ["appreciate","watch","warn","suspend"] : ["watch","warn","suspend"]; }
function syncComment(){ const cm = document.getElementById("cm"); if (cm) S.comment = cm.value; if (!S.commentEdited) S.comment = `Review the selected drivers after ${S.days} days.`; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.modal || S.pop || S.open)) { if (S.modal || S.pop) { S.modal = false; S.pop = null; } else S.open = null; render(); } });

S.route = routeOf(location.hash.slice(1)); if (SCREENS[S.route]) S.lastReg = S.route;
render();
</script>
